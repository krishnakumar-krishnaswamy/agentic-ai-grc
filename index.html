<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agentic AI GRC Pilot </title>

    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

<div class="app-container">


    <!-- ========================= -->
    <!-- Left Navigation -->
    <!-- ========================= -->

    <aside class="sidebar">

    <div class="profile-section">

        <img src="assets/images/profileTWO.png"
             class="profile-image"
             alt="Profile">

        <div class="profile-name">

            Krishnakumar Krishnaswamy

        </div>

        <button class="menu-item portfolio-button"
                id="portfolioMenu"
                onclick="openPortfolio(this)">

            <img src="assets/icons/folder.svg">

            <span>Portfolio</span>

        </button>

    </div>

    <hr class="menu-divider">

        <nav class="navigation">


            <button class="menu-item active"

                    id="homeMenu"

                    onclick="showHome(this)">

                <img src="assets/icons/home.svg">

                <span>Home</span>

            </button>



    <button class="menu-item parent"

        id="grcMenu"

        onclick="toggleGRC(this)">

    <span id="grcArrow" class="menu-arrow">▶</span>

    <img src="assets/icons/workflow.svg">

    <span>Agentic AI GRC</span>

</button>


<div id="grcChildren" class="child-menu">


    <button class="menu-item child"

            id="registrationMenu"

            onclick="loadAgent('customer-registration',this)">

        <img src="assets/icons/user-plus.svg">

        <span>Customer Registration Agent</span>

    </button>



    <button class="menu-item child"

            id="authenticationMenu"

            onclick="showAuthentication(this)">

        <img src="assets/icons/shield-check.svg">

        <span>Customer Authentication Agent</span>

    </button>



    <button class="menu-item child"

            id="authorizationMenu"

            onclick="showAuthorization(this)">

        <img src="assets/icons/key-round.svg">

        <span>Customer Authorization Agent</span>

    </button>


</div>

        </nav>


    </aside>



    <!-- ========================= -->
    <!-- Right Content -->
    <!-- ========================= -->

    <main class="main-content">

        <div id="contentCard">

        </div>

    </main>


</div>


<script src="app.js"></script>

</body>

</html>
