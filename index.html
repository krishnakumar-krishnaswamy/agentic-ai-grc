<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fn Ln Portfolio</title>

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <div class="app-container">


        <!-- Left Sidebar -->
        <aside class="sidebar">

            <div class="portfolio-name">
                Fn Ln Portfolio
            </div>


            <nav class="project-navigation">

                <button class="project-item active"
                        onclick="loadAgent('customer-registration')">
                    Customer Registration Agent
                </button>


                <button class="project-item">
                    Customer Authentication Agent
                </button>


                <button class="project-item">
                    Customer Authorization Agent
                </button>

            </nav>


            <div class="contact">
                Contact
            </div>


        </aside>



        <!-- Main Governance Canvas -->
        <main class="main-content">


            <!-- Agent Information -->
            <section id="agentMetadata"
                     class="content-section">

            </section>



            <!-- Agent Collaboration -->
            <section id="agentCollaboration"
                     class="content-section">

            </section>



            <!-- Agent Actions -->
            <section id="agentActions"
                     class="content-section">

            </section>


        </main>


    </div>



    <script src="app.js"></script>


</body>

</html>
